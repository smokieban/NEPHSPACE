server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the magic line:
        # 1. Check if the exact URI exists ($uri)
        # 2. Check if URI as a directory exists ($uri/)
        # 3. Check if the URI + .html exists ($uri.html)
        # 4. Return 404 if none of the above work
        try_files $uri $uri/ $uri.html =404;
    }

    # Optional: Redirect direct .html requests to extensionless versions
    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }
}